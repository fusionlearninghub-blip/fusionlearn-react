<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234f46e5%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3EF%3C/text%3E%3C/svg%3E" />
    <title>FusionLearn | Learn. Practice. Grow.</title>
  </head>
  <body>
    <div id="root"><p id="boot" style="font-family:sans-serif;padding:24px">Loading FusionLearn…</p></div>
    <script>
      // If the app fails before React starts, show why instead of a blank page.
      function bootFail(msg) {
        var el = document.getElementById("boot");
        if (!el) return;
        el.style.color = "#b91c1c";
        el.textContent = "FusionLearn failed to start: " + msg + " (press F12 and open Console for details)";
      }
      window.addEventListener("error", function (e) {
        var t = e.target;
        bootFail(t && t.src ? "could not load " + t.src : e.message || "script error");
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        bootFail(String((e.reason && e.reason.message) || e.reason));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
